services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
  wp:
    image: wordpress:php8.3-apache
    ports:
      - "8089:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISABLE_WP_CRON', false);
        define('LINKSENTINEL_PRO_DEV', true);
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/link-sentinel
      - ./mu:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('LINKSENTINEL_PRO_DEV', true);
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/link-sentinel
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["wp"]
    command: ["--info"]
volumes:
  db: {}
  wp: {}
